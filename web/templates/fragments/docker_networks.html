<div class="panel">
<table class="docker-table">
<thead><tr><th>Nama</th><th>Driver</th><th>Subnet</th><th>Container Terhubung</th><th>Aksi</th></tr></thead>
<tbody>
{{range .Networks}}
<tr>
  <td>{{.Name}}{{if .Builtin}} <span class="badge">builtin</span>{{end}}</td>
  <td class="text-muted">{{.Driver}}</td>
  <td class="text-muted">{{.Subnet}}</td>
  <td>{{.ConnectedCount}}</td>
  <td class="actions">
    {{if not .Builtin}}
    <button class="btn-sm btn-danger" hx-post="/fragments/docker/networks/{{.ID}}/remove" hx-target="#docker-tab-panel" hx-swap="innerHTML" hx-confirm="Hapus network {{.Name}}?">Hapus</button>
    {{end}}
  </td>
</tr>
{{else}}
<tr><td colspan="5" class="text-muted">Tidak ada network.</td></tr>
{{end}}
</tbody>
</table>
</div>
