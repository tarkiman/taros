{{define "title"}}{{.Filename}} — Edit — TarkimanOS{{end}}

{{define "extra_head"}}
<link rel="stylesheet" href="/static/css/editor.css">
{{end}}

{{define "content"}}
<header class="topnav">
  <span class="brand">TarkimanOS</span>
  <nav class="topnav-links">
    <a href="/">Dashboard</a>
    <a href="/docker">Docker</a>
    <a href="/services">Service</a>
    <a href="/files" class="active">Files</a>
  </nav>
  <span class="user">{{.Username}}</span>
  <form method="post" action="/api/auth/logout">
    <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
    <button type="submit">Keluar</button>
  </form>
</header>
<main class="editor-page">
  <div class="editor-toolbar">
    <a class="btn-sm" href="/files?path={{.Path}}">← Kembali</a>
    <span id="editor-filename">{{.Filename}}</span>
    <span id="editor-dirty" class="badge badge-warn" style="display:none">belum disimpan</span>
    <span class="spacer"></span>
    <label class="text-muted"><input type="checkbox" id="chk-wrap"> Word wrap</label>
    <button class="btn-sm" id="btn-save">Simpan (Ctrl+S)</button>
  </div>
  <div id="editor-mount" data-path="{{.Path}}"></div>
  <p id="editor-status" class="text-muted"></p>
</main>
{{end}}

{{define "extra_scripts"}}
<script src="/static/js/vendor/editor.bundle.js"></script>
<script src="/static/js/editor.js"></script>
{{end}}

{{template "layout" .}}
