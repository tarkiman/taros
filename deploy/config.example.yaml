# Contoh config.yaml untuk TarkimanOS — hanya berisi bagian yang sudah
# diimplementasikan (Fase 0: server + auth; Fase 1: polling metrics;
# Fase 2: docker + systemd; Fase 3a: file explorer inti). Section lain
# (terminal, thresholds, dst — lihat docs/09-deployment.md §9.6) akan
# ditambahkan seiring fase implementasinya selesai. Field streaming/job
# queue untuk fileExplorer (maxUploadSizeMB, copyThrottleMBps, dst)
# menyusul di Fase 3b bersama fitur yang membutuhkannya.

server:
  listen: "0.0.0.0:8090"

auth:
  credentialsFile: "/etc/tarkimanos/credentials.yaml"
  sessionIdleTimeoutMin: 1440
  loginRateLimitAttempts: 5
  loginRateLimitWindowSec: 300

polling:
  cpuMemNetIntervalSec: 2
  diskUsageIntervalSec: 10
  tempIntervalSec: 5

docker:
  enabled: true
  socketPath: "/var/run/docker.sock"
  watchIntervalSec: 5   # target minimum jeda antar refresh cache container — lihat 05-data-storage.md

systemd:
  protectedUnits:
    - "ssh.service"
    - "docker.service"
    - "tarkimanos.service"

fileExplorer:
  rootDir: "/"
  blocklist:
    - "/etc/shadow"
    - "/etc/shadow-"   # vipw/pwck leave the previous version here — same sensitivity
    - "/etc/gshadow"
    - "/etc/gshadow-"
    - "/proc"
    - "/sys"
    # ".ssh" directories (any user's) are blocked automatically by internal/fileexplorer,
    # not via this list — see docs/07-security.md §7.3.
