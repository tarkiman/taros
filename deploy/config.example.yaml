# Contoh config.yaml untuk TarOS — semua section fase inti (0-4)
# sudah tercakup di sini. Section lain (mis. thresholds gauge per-metric —
# lihat docs/09-deployment.md §9.6) akan ditambahkan seiring fase
# implementasinya selesai.

server:
  listen: "0.0.0.0:8090"

auth:
  credentialsFile: "/etc/taros/credentials.yaml"
  sessionIdleTimeoutMin: 1440
  loginRateLimitAttempts: 5
  loginRateLimitWindowSec: 300

polling:
  cpuMemNetIntervalSec: 2
  diskUsageIntervalSec: 10
  tempIntervalSec: 5
  procIntervalSec: 5   # daftar proses OS ("Pemakai Teratas" di Dashboard) — lebih jarang dari
                        # cpuMemNetIntervalSec karena baca /proc per-PID lebih berat, dan cuma
                        # perlu segar saat widget-nya benar-benar dibuka, bukan tiap detik

docker:
  enabled: true
  socketPath: "/var/run/docker.sock"
  watchIntervalSec: 5   # target minimum jeda antar refresh cache container — lihat 05-data-storage.md

systemd:
  protectedUnits:
    - "ssh.service"
    - "docker.service"
    - "taros.service"

fileExplorer:
  rootDir: "/"
  blocklist:
    - "/etc/shadow"
    - "/etc/shadow-"   # vipw/pwck leave the previous version here — same sensitivity
    - "/etc/gshadow"
    - "/etc/gshadow-"
    - "/proc"
    - "/sys"
    # ".ssh" directories (any user's) are blocked automatically by internal/fileexplorer,
    # not via this list — see docs/07-security.md §7.3.
  maxUploadSizeMB: 500
  maxConcurrentOps: 2         # copy/move besar diantrekan, tidak dijalankan paralel tanpa batas
  copyThrottleMBps: 0         # 0 = tanpa batas; set (mis. 20) di storage lambat (eMMC/SD STB)
  copySyncEveryMB: 32         # panggil fsync tiap N MB agar writeback bertahap, bukan menumpuk

terminal:
  # Fitur berisiko tertinggi di aplikasi ini (akses shell sungguhan) —
  # sengaja OFF secara default, harus diaktifkan sadar. Lihat
  # docs/04-features.md §4.5 & docs/07-security.md §7.6 sebelum
  # mengaktifkan, terutama soal sudo di dalam sesi terminal.
  enabled: false
  shell: "/bin/bash"          # eksplisit, TIDAK mengikuti shell akun taros di /etc/passwd
  idleTimeoutMin: 15
  maxConcurrentSessions: 1

update:
  # Tombol "Update" di topbar dashboard — cek & pasang rilis GitHub
  # terbaru sendiri, restart otomatis (lihat docs/09-deployment.md §9.5).
  # ON secara default (beda dari terminal di atas): tidak memberi akses
  # shell/command apa pun, cuma mengganti binary ini sendiri dengan asset
  # resmi dari github.com/tarkiman/taros — set false untuk update manual
  # saja lewat scripts/quick-install.sh.
  enabled: true

dashboard:
  # /opt/taros, bukan /etc/taros — direktori ini sudah dimiliki (chown -R)
  # user servis oleh scripts/install.sh untuk keperluan self-update, jadi
  # aman ditulis proses taros yang berjalan tanpa root tanpa langkah
  # instalasi tambahan (beda dari /etc/taros, yang cuma file config.yaml/
  # credentials.yaml spesifiknya yang di-chown, bukan direktorinya).
  quickLinksFile: "/opt/taros/quick-links.yaml"
